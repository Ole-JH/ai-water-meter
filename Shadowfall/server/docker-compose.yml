services:
  shadowfall:
    build: .
    container_name: shadowfall
    restart: unless-stopped
    ports:
      # The only port the game needs (web page + game connection on /ws).
      # Change the host side with SHADOWFALL_PORT, e.g. SHADOWFALL_PORT=9000 docker compose up -d
      - "${SHADOWFALL_PORT:-7341}:7341"
    volumes:
      - ./data:/data         # accounts, characters and the world map
      - ./public:/app/public:ro   # the Unity WebGL build
    environment:
      # Comma-separated character names with admin rights (admin panel: F10 in game, or /a in chat).
      # Set it in server/.env, e.g.  ADMINS=Kissmypiss
      ADMINS: ${ADMINS:-}
    stop_grace_period: 10s

  # Builds the Unity WebGL client in Docker and writes it to ./public (no local Unity needed).
  # Only runs on demand: task client:build   (or: docker compose --profile build run --rm client-builder)
  client-builder:
    profiles: ["build"]
    image: unityci/editor:ubuntu-${UNITY_VERSION:-6000.0.23f1}-webgl-3
    working_dir: /project
    entrypoint: ["bash", "/project/tools/docker-build-client.sh"]
    environment:
      UNITY_LICENSE: ${UNITY_LICENSE:-}
      UNITY_SERIAL: ${UNITY_SERIAL:-}
      UNITY_EMAIL: ${UNITY_EMAIL:-}
      UNITY_PASSWORD: ${UNITY_PASSWORD:-}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ..:/project                          # the Unity project (Shadowfall/)
      - unity-library:/project/Library       # import cache: makes rebuilds much faster

  # One-time helper: Unity Hub in a container, shown in your browser via noVNC, to get a free
  # Unity Personal license file into ../unity-license. Run: task license:activate
  license-helper:
    profiles: ["license"]
    build: ../tools/license-helper
    image: shadowfall-license-helper
    shm_size: "1gb"
    ports:
      # Set LICENSE_HELPER_BIND=127.0.0.1 to reach it only through an SSH tunnel.
      - "${LICENSE_HELPER_BIND:-0.0.0.0}:${LICENSE_HELPER_PORT:-6080}:6080"
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      LICENSE_HELPER_PORT: ${LICENSE_HELPER_PORT:-6080}
    volumes:
      - ../unity-license:/out

volumes:
  unity-library:
    name: shadowfall-unity-library
