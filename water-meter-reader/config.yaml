esp32:
  url: "http://192.168.1.x/capture"   # JPEG snapshot endpoint
  timeout_sec: 10

coral:
  model_path: "/home/pi/models/dig-cont_0168_s2_q_edgetpu.tflite"
  # Use ana-cont model for rotating-pointer dials instead of digit wheels
  # model_path: "/home/pi/models/ana-cont_1105_s2_q_edgetpu.tflite"
  model_type: "digital"               # "digital" | "analog"

mqtt:
  broker: "192.168.1.x"
  port: 1883
  topic: "watermeter/value"
  topic_raw: "watermeter/raw"         # publish digit array before assembly
  client_id: "water-meter-reader"

meter:
  interval_sec: 60
  integer_digits: 5                   # digits before decimal point
  decimal_digits: 3                   # digits after decimal point
  reference_image_path: "/home/pi/meter_reference.jpg"

# ROI boxes: [x, y, width, height] in pixels on the captured image.
# Each entry is one digit (left to right).
# Tune these by running: python3 roi.py --capture
rois:
  - [120, 80, 40, 60]
  - [165, 80, 40, 60]
  - [210, 80, 40, 60]
  - [255, 80, 40, 60]
  - [300, 80, 40, 60]
  - [355, 80, 40, 60]   # decimal digits start here
  - [400, 80, 40, 60]
  - [445, 80, 40, 60]

alignment:
  enabled: true
  method: "ecc"                       # "ecc" | "orb" | "none"
  max_shift_px: 30                    # reject alignment if shift exceeds this
