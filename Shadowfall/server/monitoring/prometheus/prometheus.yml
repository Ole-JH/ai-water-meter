# Prometheus for Shadowfall. Scrapes the game server, the host, the containers and the stack itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: shadowfall          # the game server (server/metrics.js), on its private metrics port
    static_configs:
      - targets: ["shadowfall:9464"]
  - job_name: postgres            # the account database
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node                # the host machine (CPU, memory, disk, network)
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor            # every container
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
