<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0c10; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0d0c10; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #e8dcc0; font: 16px system-ui, sans-serif; background: #0d0c10; }
    #loading h1 { color: #ffbf4d; letter-spacing: .15em; font-size: 48px; margin: 0 0 24px; }
    #bar { width: min(420px, 80vw); height: 10px; background: #2a241c; border: 1px solid #5a4a30; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #a0522d, #ffbf4d); transition: width .2s; }
    #msg { margin-top: 12px; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>SHADOWFALL</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Loading the world...</div>
  </div>
  <script>
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };
    var canvas = document.getElementById("unity-canvas");
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        document.getElementById("msg").textContent = "Failed to load: " + message;
      });
    };
    document.body.appendChild(script);
    // Stop the browser's context menu so right-click can cast spells.
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
