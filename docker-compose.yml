services:
  meter-reader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meter-reader
    restart: unless-stopped

    environment:
      # Override config.yaml values with secrets here
      # Alternatively put them in a .env file alongside this compose file
      CAMERA_URL: ${CAMERA_URL:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}

    volumes:
      # Config: edit config/config.yaml for ROIs, model names, topics
      - ./config:/config:ro
      # Models: drop jomjol's .tflite files here
      # Get them from: https://github.com/jomjol/AI-on-the-edge-device/tree/main/sd-card/config
      - ./models:/models:ro
      # Snapshots: latest.jpg written here for ROI calibration
      - ./snapshots:/snapshots

    # Optional: run on Pi with network_mode host if camera is on same LAN
    # and you have mDNS issues reaching ESPHome by hostname
    # network_mode: host

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('${CAMERA_URL:-http://localhost}', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
