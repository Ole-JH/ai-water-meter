# Alertmanager: groups and routes the alerts from prometheus/alerts.yml.
# Out of the box alerts are only shown in Grafana (Alerting > Alert rules / the Alertmanager data source).
# To get notified, add a receiver below and point the route at it, e.g. a Discord/Slack-compatible webhook:
#
#   receivers:
#     - name: discord
#       discord_configs:
#         - webhook_url: https://discord.com/api/webhooks/...
#   route:
#     receiver: discord
#
# then: docker compose restart alertmanager
route:
  receiver: "null"
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "null"
